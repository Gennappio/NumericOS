# Stability of the explicit scheme for the 2D heat equation, as a NumericOS experiment.
# From the top of this repository:
#   numericos experiment run examples/heat2d-python/experiment.yaml -p PROJECT_ID -P dt=0.0002
schema: numericos.experiment.v1
name: heat2d-stability
question: >-
  On a 32 x 32 grid, does the explicit FTCS scheme for the 2D heat equation stay bounded and
  accurate when r = alpha dt / h^2 is below the stability limit of this scheme, and does it
  blow up above it?
prediction: >-
  For r <= 1/4 the largest |u| never exceeds its initial value 1 and the L2 error against the
  analytic solution stays small. For r above the limit, round-off errors grow without bound.
falsification:
  - A run with r <= 1/4 in which the largest |u| exceeds 1.
  - A run with r clearly above the limit that stays bounded for all its steps.
independent_variables:
  # h = 1/32, so r = 1024 dt: 0.2048 and 0.24576 (stable), 0.26624 and 0.3072 (unstable).
  dt: [0.0002, 0.00024, 0.00026, 0.0003]
controls:
  grid: 32
  steps: 600
  alpha: 1.0
  report_every: 10
execution:
  workdir: examples/heat2d-python
  command:
    - python3
    - heat2d.py
    - --dt
    - "{dt}"
    - --grid
    - "{grid}"
    - --steps
    - "{steps}"
    - --alpha
    - "{alpha}"
    - --report-every
    - "{report_every}"
metrics:
  - name: max_abs_u
    unit: "1"
    sampled_by: instrumentation
    description: Largest |u| over the grid.
  - name: l2_error
    unit: "1"
    sampled_by: instrumentation
    description: Discrete L2 norm of the difference to the analytic solution.
  - name: norm_l2
    unit: "1"
    sampled_by: parser
    description: Discrete L2 norm of u, read from the program's progress lines.
  - {name: wall_time, unit: s, sampled_by: supervisor}
  - {name: cpu_time, unit: s, sampled_by: supervisor}
  - {name: max_rss, unit: bytes, sampled_by: supervisor}
observability:
  resource_interval_seconds: 0.5
  parsers:
    - name: progress
      pattern: '^step\s+(?P<step>\d+)\s+t=(?P<time>\S+)\s+norm=(?P<norm_l2>\S+)'
guardrails:
  non_finite: halt
  rules:
    # Not a tuning knob: for r <= 1/4 this scheme obeys a discrete maximum principle, so with
    # this initial condition |u| <= 1 at every step (see README.md). A value above 1 is a
    # violated invariant.
    - {metric: max_abs_u, above: 1.0, patience: 3, action: halt}
limits:
  wall_seconds: 120
