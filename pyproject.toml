[project]
name = "numericos"
version = "0.0.1"
description = "NumericOS: local-first agentic workbench for computational and numerical research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "httpx>=0.27",
  "python-ulid>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "sse-starlette>=2.1",
]

[project.scripts]
numericos = "numericos.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numericos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Python only: never reformat code blocks inside the specification pack (*.md).
include = ["*.py", "*.pyi", "**/pyproject.toml"]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
exclude = ["src/numericos/persistence/migrations/versions/"]
